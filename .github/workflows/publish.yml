# Publish extension to VS Code Marketplace and Open VSX, attach .vsix to release
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: latest
      - run: npm ci --ignore-scripts
      - run: npm audit
      # Version from release tag like v1.2.0
      - run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: node generate.ts .vscode/settings.json
      - run: npx vsce package --out build/lichen-theme.vsix
      - run: npx vsce publish --packagePath build/lichen-theme.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: npx ovsx publish build/lichen-theme.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: gh release upload "$GITHUB_REF_NAME" build/lichen-theme.vsix
        env:
          GH_TOKEN: ${{ github.token }}
