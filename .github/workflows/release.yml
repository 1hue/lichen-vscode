# Build .vsix, attach to release and publish to Open VSX
name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: latest
      - run: npm ci --ignore-scripts
      - run: npm audit
      # Version from release tag like v1.2.0
      - run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: node generate.ts .vscode/settings.json
      - run: npx vsce package --out build/lichen-theme.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: build/lichen-theme.vsix

  attach:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: gh release upload "$GITHUB_REF_NAME" lichen-theme.vsix --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  open-vsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: latest
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: npx ovsx publish lichen-theme.vsix --trusted-publishing
